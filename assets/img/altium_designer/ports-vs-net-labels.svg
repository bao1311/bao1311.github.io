<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="660" viewBox="0 0 1200 660"><rect width="1200" height="660" fill="#f4f7fb"/><g font-family="Arial,sans-serif" fill="#17324d"><text x="60" y="65" font-size="32" font-weight="bold">Ports vs. Net Labels</text><text x="60" y="105" font-size="22">Example: Net Identifier Scope = Flat</text><rect x="60" y="145" width="1080" height="205" rx="12" fill="white" stroke="#c5d2e0"/><text x="90" y="185" font-size="23" font-weight="bold">Matching ports connect across sheets</text><text x="100" y="235" font-size="20">Sheet A</text><text x="780" y="235" font-size="20">Sheet B</text><path d="M100 285 H260 M420 285 H780 M940 285 H1090" stroke="#16846c" stroke-width="4" fill="none"/><path d="M260 260 H395 L420 285 L395 310 H260 Z M780 260 H915 L940 285 L915 310 H780 Z" fill="#d6f3e8" stroke="#16846c" stroke-width="3"/><text x="280" y="293" font-size="22">SIGNAL</text><text x="800" y="293" font-size="22">SIGNAL</text><rect x="60" y="380" width="1080" height="205" rx="12" fill="white" stroke="#c5d2e0"/><text x="90" y="420" font-size="23" font-weight="bold">Matching net labels stay local to each sheet</text><text x="100" y="465" font-size="20">Sheet A</text><text x="780" y="465" font-size="20">Sheet B</text><path d="M100 530 H420 M780 530 H1090" stroke="#42668b" stroke-width="4"/><text x="220" y="520" font-size="22">SIGNAL</text><text x="800" y="520" font-size="22">SIGNAL</text><text x="485" y="535" font-size="20">No cross-sheet link</text><text x="60" y="630" font-size="19">Hierarchical and Global scope have different connection rules.</text></g></svg>